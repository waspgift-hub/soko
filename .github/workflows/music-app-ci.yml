name: SokoVibe Music Flutter CI

on:
  push:
    branches: [soko-vibe-music]
    paths:
      - 'music_app/**'
      - '.github/workflows/music-app-ci.yml'
  pull_request:
    paths:
      - 'music_app/**'
      - '.github/workflows/music-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test and build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sokovibe-music-debug-apk
          path: music_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
