name: SokoVibe Music Flutter checks

on:
  pull_request:
    paths:
      - "music_app/**"
      - ".github/workflows/music-app-ci.yml"
  push:
    branches:
      - "feat/music-sound-google-auth"
    paths:
      - "music_app/**"
      - ".github/workflows/music-app-ci.yml"

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run tests
        run: flutter test
