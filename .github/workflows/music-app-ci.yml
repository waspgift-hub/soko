name: SokoVibe Music Flutter CI

on:
  push:
    branches: [soko-vibe-music]
    paths:
      - 'music_app/**'
      - '.github/workflows/music-app-ci.yml'
  pull_request:
    paths:
      - 'music_app/**'
      - '.github/workflows/music-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test and build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Generate Android v2 project files
        run: |
          flutter create --platforms=android .
          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
            from pathlib import Path
            p = Path('android/app/build.gradle.kts')
            s = p.read_text()
            if 'isCoreLibraryDesugaringEnabled = true' not in s:
                s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
            if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in s:
                marker = 'dependencies {'
                if marker not in s:
                    raise SystemExit('Could not find dependencies block in build.gradle.kts')
                s = s.replace(marker, marker + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', 1)
            p.write_text(s)
            PY
          elif [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
            from pathlib import Path
            p = Path('android/app/build.gradle')
            s = p.read_text()
            if 'coreLibraryDesugaringEnabled true' not in s:
                s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
            if 'coreLibraryDesugaring \'com.android.tools:desugar_jdk_libs:' not in s:
                s = s.replace('dependencies {', "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'", 1)
            p.write_text(s)
            PY
          else
            echo 'Android app Gradle file not found' >&2
            exit 1
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Replace generated placeholder test
        run: |
          rm -f test/widget_test.dart
          cat > test/music_track_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:soko_vibe_music/models/music_track.dart';

          void main() {
            group('MusicTrack.fromJson', () {
              test('parses normalized fields', () {
                final track = MusicTrack.fromJson({
                  'id': 42,
                  'title': 'Test song',
                  'artist': 'Test artist',
                  'image': 'https://example.com/cover.jpg',
                  'streaming_url': 'https://example.com/audio.mp3',
                });
                expect(track.id, '42');
                expect(track.title, 'Test song');
                expect(track.artist, 'Test artist');
                expect(track.image, 'https://example.com/cover.jpg');
                expect(track.streamUrl, 'https://example.com/audio.mp3');
              });

              test('supports API aliases and empty values', () {
                final track = MusicTrack.fromJson({
                  'track_id': 7,
                  'name': 'Alias song',
                  'artist_name': 'Alias artist',
                  'album_image': 'https://example.com/alias.jpg',
                  'audio': 'https://example.com/alias.mp3',
                });
                expect(track.id, '7');
                expect(track.title, 'Alias song');
                expect(track.artist, 'Alias artist');
                expect(track.image, 'https://example.com/alias.jpg');
                expect(track.streamUrl, 'https://example.com/alias.mp3');

                final empty = MusicTrack.fromJson({});
                expect(empty.title, 'Unknown title');
                expect(empty.artist, 'Unknown artist');
                expect(empty.streamUrl, isNull);
              });
            });
          }
          EOF
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run tests
        run: flutter test --no-pub
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sokovibe-music-debug-apk
          path: music_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
