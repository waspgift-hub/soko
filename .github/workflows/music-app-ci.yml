name: SokoVibe Music Flutter checks

concurrency:
  group: sokovibe-music-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "music_app/**"
      - "music-api/**"
      - ".github/workflows/music-app-ci.yml"
  push:
    branches:
      - "feat/music-sound-google-auth"
      - "feat/youtube-discovery-no-api-key"
    paths:
      - "music_app/**"
      - "music-api/**"
      - ".github/workflows/music-app-ci.yml"

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music_app
    env:
      MUSIC_API_URL: https://soko-vibe-music-backend.wapalila.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android .
      - name: Set Android minimum SDK for Firebase
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
      - name: Set Android compile SDK for current plugins
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - name: Enable Java core library desugaring for notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = text.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dependency not in text:
              text += f'\n\ndependencies {{\n    {dependency}\n}}\n'
          path.write_text(text)
          print("Verified desugaring dependency:", dependency in path.read_text())
          PY
      - name: Remove generated Flutter template test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=MUSIC_API_URL=$MUSIC_API_URL
      - name: Verify release APK exists and is non-empty
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sokovibe-music-release-apk
          path: music_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Deploy Cloudflare Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/music-sound-google-auth'))
        working-directory: music-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 35d732ca8d46566a3825a5c37b2343d3
        run: npx --yes wrangler deploy --config wrangler.toml

      - name: Explain skipped Worker deployment when no token is configured
        if: env.CLOUDFLARE_API_TOKEN == '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/music-sound-google-auth'))
        run: echo "CLOUDFLARE_API_TOKEN is not configured; production deployment is skipped."

      - name: Smoke test live Cloudflare Worker and Jamendo
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/feat/music-sound-google-auth' || github.ref == 'refs/heads/feat/youtube-discovery-no-api-key'))
        run: |
          set -euo pipefail
          echo "Checking Worker health and Jamendo connectivity at $MUSIC_API_URL"
          curl --fail --silent --show-error --max-time 20 "$MUSIC_API_URL/api/health" -o /tmp/music-health.json
          node -e 'const h=require("/tmp/music-health.json"); if(h.status!=="healthy" || !h.jamendo?.configured || !h.jamendo?.connected) throw new Error("Worker/Jamendo health check failed: "+JSON.stringify(h)); console.log("Health OK:", h.service, "Jamendo connected");'
          search_status=000
          for attempt in 1 2 3; do
            search_status=$(curl --silent --show-error --max-time 25 --get --data-urlencode "q=afrobeat" "$MUSIC_API_URL/search" -o /tmp/music-search.json -w '%{http_code}' || true)
            if [ "$search_status" = "200" ]; then break; fi
            echo "Search attempt $attempt returned HTTP $search_status: $(cat /tmp/music-search.json 2>/dev/null || true)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
          done
          if [ "$search_status" != "200" ]; then echo "Jamendo search failed after retries"; exit 1; fi
          node -e 'const j=require("/tmp/music-search.json"); if(!Array.isArray(j.results) || j.results.length<1 || !j.results[0].id) throw new Error("Search returned no track: "+JSON.stringify(j)); console.log("Search OK: returned", j.results.length, "tracks");'
          track_id=$(node -e 'process.stdout.write(String(require("/tmp/music-search.json").results[0].id))')
          curl --fail --silent --show-error --max-time 20 "$MUSIC_API_URL/play/$track_id" -o /tmp/music-play.json
          TRACK_ID="$track_id" node -e 'const p=require("/tmp/music-play.json"); const t=p.track || p; const u=new URL(t.streaming_url); if(String(t.id)!==String(process.env.TRACK_ID) || u.protocol!=="https:") throw new Error("Play endpoint returned invalid track/HTTPS URL: "+JSON.stringify(p)); console.log("Play metadata OK for track",t.id,"with HTTPS audio URL");'
          download_status=$(curl --silent --show-error --max-time 20 -D /tmp/music-download.headers -o /dev/null -w '%{http_code}' "$MUSIC_API_URL/download/$track_id" || true)
          if [ "$download_status" = "302" ]; then
            grep -Eiq '^location: https://' /tmp/music-download.headers || { echo "Download redirect was not HTTPS"; exit 1; }
            echo "Download endpoint correctly returns a licensed HTTPS redirect (track may still be license-restricted)."
          elif [ "$download_status" = "403" ]; then
            echo "Download endpoint correctly enforced provider license restrictions for this track."
          else
            echo "Unexpected download endpoint status: $download_status"
            cat /tmp/music-download.headers
            exit 1
          fi

  production-e2e:
    name: Production music source E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    env:
      MUSIC_API_URL: https://soko-vibe-music-backend.wapalila.workers.dev
    steps:
      - name: Check production health and Jamendo connectivity
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 "$MUSIC_API_URL/api/health" -o /tmp/health.json
          node <<'NODE'
          const h = require('/tmp/health.json');
          if (h.status !== 'healthy' || h.jamendo?.configured !== true || h.jamendo?.connected !== true) {
            console.error('FAIL: Worker/Jamendo health:', JSON.stringify(h));
            process.exit(1);
          }
          console.log('PASS: Worker healthy; Jamendo configured and reachable.');
          NODE
      - name: Search catalog and validate real track metadata
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 --get --data-urlencode 'q=afrobeat' "$MUSIC_API_URL/search" -o /tmp/search.json -w '%{http_code}')
          test "$code" = 200 || { echo "FAIL: search HTTP $code"; cat /tmp/search.json; exit 1; }
          node <<'NODE'
          const j = require('/tmp/search.json');
          if (!Array.isArray(j.results) || j.results.length < 1) {
            console.error('FAIL: Search returned no tracks:', JSON.stringify(j)); process.exit(1);
          }
          const t = j.results.find(x => /^\d+$/.test(String(x.id)) && x.title && x.artist);
          if (!t) { console.error('FAIL: No usable track metadata:', JSON.stringify(j.results[0])); process.exit(1); }
          require('fs').writeFileSync('/tmp/track-id', String(t.id));
          console.log('PASS: Search returned', j.results.length, 'tracks; sample:', t.title, '—', t.artist);
          NODE
      - name: Resolve play request and verify actual audio bytes
        run: |
          set -euo pipefail
          id=$(cat /tmp/track-id)
          code=$(curl --silent --show-error --max-time 25 "$MUSIC_API_URL/play/$id" -o /tmp/play.json -w '%{http_code}')
          test "$code" = 200 || { echo "FAIL: play HTTP $code"; cat /tmp/play.json; exit 1; }
          node <<'NODE'
          const p = require('/tmp/play.json');
          const t = p.track;
          if (!t || String(t.id) !== require('fs').readFileSync('/tmp/track-id', 'utf8') ||
              typeof t.streaming_url !== 'string' || !t.streaming_url.startsWith('https://')) {
            console.error('FAIL: Invalid play metadata:', JSON.stringify(p)); process.exit(1);
          }
          require('fs').writeFileSync('/tmp/stream-url', t.streaming_url);
          console.log('PASS: /play/:id resolved to an HTTPS stream for track', t.id);
          NODE
          stream=$(cat /tmp/stream-url)
          code=$(curl --location --silent --show-error --max-time 35 -H 'Range: bytes=0-4095' "$stream" -o /tmp/audio-sample -w '%{http_code}' -D /tmp/audio-headers)
          case "$code" in 200|206) ;; *) echo "FAIL: audio stream HTTP $code"; cat /tmp/audio-headers; exit 1;; esac
          test -s /tmp/audio-sample || { echo "FAIL: audio response body is empty"; exit 1; }
          grep -Eiq '^content-type:.*(audio|octet-stream)' /tmp/audio-headers || { echo "FAIL: response is not identified as audio"; cat /tmp/audio-headers; exit 1; }
          echo "PASS: Audio source delivered non-empty bytes (HTTP $code) with audio content type."
      - name: Verify recommendations endpoint returns usable tracks
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 -H 'Content-Type: application/json' -d '{"mood":"happy","genre":"afrobeat","limit":5}' "$MUSIC_API_URL/api/recommend" -o /tmp/recommend.json -w '%{http_code}')
          test "$code" = 200 || { echo "FAIL: recommend HTTP $code"; cat /tmp/recommend.json; exit 1; }
          node <<'NODE'
          const r = require('/tmp/recommend.json');
          if (!Array.isArray(r.recommendations) || !r.recommendations.every(t => t.id && t.title && t.artist)) {
            console.error('FAIL: Invalid recommendations payload:', JSON.stringify(r)); process.exit(1);
          }
          console.log('PASS: Recommendations endpoint returned', r.recommendations.length, 'valid tracks.');
          NODE
      - name: Check YouTube discovery provider availability
        run: |
          set -euo pipefail
          node <<'NODE'
          const hosts = ['https://inv.nadeko.net', 'https://invidious.nerdvpn.de', 'https://invidious.privacyredirect.com'];
          let working = 0;
          for (const host of hosts) {
            try {
              const u = new URL('/api/v1/search', host);
              u.searchParams.set('q', 'music');
              u.searchParams.set('type', 'video');
              const res = await fetch(u, { signal: AbortSignal.timeout(8000), headers: { accept: 'application/json' } });
              if (!res.ok) { console.log('UNAVAILABLE:', host, 'HTTP', res.status); continue; }
              const body = await res.json();
              if (!Array.isArray(body)) { console.log('INVALID:', host, 'unexpected response'); continue; }
              console.log('PASS:', host, 'returned', body.length, 'video results');
              working++;
            } catch (e) { console.log('UNAVAILABLE:', host, e.message); }
          }
          if (working === 0) {
            console.error('FAIL: All configured YouTube metadata instances are unavailable.');
            process.exit(1);
          }
          console.log('PASS: At least one YouTube discovery source is responding.');
          NODE
