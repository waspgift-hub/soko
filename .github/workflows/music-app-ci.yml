name: SokoVibe Music Flutter checks

on:
  pull_request:
    paths:
      - "music_app/**"
      - ".github/workflows/music-app-ci.yml"
  push:
    branches:
      - "feat/music-sound-google-auth"
    paths:
      - "music_app/**"
      - ".github/workflows/music-app-ci.yml"

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android .
      - name: Set Android minimum SDK for Firebase
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
      - name: Enable Java core library desugaring for notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = text.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          if "coreLibraryDesugaring(" not in text:
              text = text.replace(
                  'dependencies {',
                  'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                  1,
              )
          path.write_text(text)
          PY
      - name: Remove generated Flutter template test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sokovibe-music-debug-apk
          path: music_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
