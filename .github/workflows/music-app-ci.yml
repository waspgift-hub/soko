name: SokoVibe Music Flutter checks

on:
  pull_request:
    paths:
      - "music_app/**"
      - ".github/workflows/music-app-ci.yml"
  push:
    branches:
      - "feat/music-sound-google-auth"
    paths:
      - "music_app/**"
      - ".github/workflows/music-app-ci.yml"

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android .
      - name: Set Android minimum SDK for Firebase
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
      - name: Enable Java core library desugaring for notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = text.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dependency not in text:
              text += f'\n\ndependencies {{\n    {dependency}\n}}\n'
          path.write_text(text)
          print("Verified desugaring dependency:", dependency in path.read_text())
          PY
      - name: Remove generated Flutter template test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Smoke test live Jamendo Worker
        env:
          MUSIC_API_URL: https://soko-vibe-music-backend.sokovibe-co-tz.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "$MUSIC_API_URL/api/health" -o /tmp/music-health.json
          node -e 'const h=require("/tmp/music-health.json"); if(h.status!=="healthy" || !h.jamendo?.configured || !h.jamendo?.connected) throw new Error("Worker/Jamendo health check failed: "+JSON.stringify(h)); console.log("Health OK:", h.service, "Jamendo connected");'
          curl --fail --silent --show-error --max-time 20 --get --data-urlencode "q=afrobeat" "$MUSIC_API_URL/search" -o /tmp/music-search.json
          node -e 'const j=require("/tmp/music-search.json"); if(!Array.isArray(j.results) || j.results.length<1 || !j.results[0].id) throw new Error("Search returned no playable track: "+JSON.stringify(j)); console.log("Search OK: returned", j.results.length, "tracks");'
          track_id=$(node -e 'process.stdout.write(String(require("/tmp/music-search.json").results[0].id))')
          curl --fail --silent --show-error --max-time 20 "$MUSIC_API_URL/play/$track_id" -o /tmp/music-play.json
          node -e 'const p=require("/tmp/music-play.json"); const t=p.track || p; const u=new URL(t.streaming_url); if(!t.id || u.protocol!=="https:") throw new Error("Play endpoint returned invalid URL: "+JSON.stringify(p)); console.log("Play URL OK for track", t.id);'
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sokovibe-music-debug-apk
          path: music_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
