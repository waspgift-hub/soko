name: SokoVibe Music Flutter CI

on:
  push:
    branches: [soko-vibe-music]
    paths:
      - 'music_app/**'
      - '.github/workflows/music-app-ci.yml'
  pull_request:
    paths:
      - 'music_app/**'
      - '.github/workflows/music-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test and build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Generate Android v2 project files without replacing the app manifest
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          saved_manifest=""
          if [ -f "$manifest" ]; then
            saved_manifest="$(mktemp)"
            cp "$manifest" "$saved_manifest"
          fi
          flutter create --platforms=android .
          if [ -n "$saved_manifest" ]; then
            cp "$saved_manifest" "$manifest"
            rm -f "$saved_manifest"
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if not p.exists():
              p = Path('android/app/build.gradle')
          if not p.exists():
              raise SystemExit('Android app Gradle file not found')
          s = p.read_text()
          if p.name.endswith('.kts'):
              if 'isCoreLibraryDesugaringEnabled = true' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              if 'coreLibraryDesugaring(' not in s:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          else:
              if 'coreLibraryDesugaringEnabled true' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              if 'coreLibraryDesugaring ' not in s and 'coreLibraryDesugaring(' not in s:
                  s += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n}\n"
          p.write_text(s)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Remove generated placeholder widget test
        run: rm -f test/widget_test.dart
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run tests
        run: flutter test --no-pub
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sokovibe-music-debug-apk
          path: music_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
