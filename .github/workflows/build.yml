name: CI - Flutter + Node

on:
  pull_request:
    paths:
      - 'soko_langu/**'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - 'soko_langu/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + test + web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soko_langu
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --base-href /

  node:
    name: Node API lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soko_langu/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: soko_langu/server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  android:
    name: Android release build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flutter, node]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soko_langu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: soko_langu/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: soko_langu/build/app/outputs/bundle/release/app-release.aab
