name: CI - Flutter + Node

on:
  pull_request:
    paths:
      - 'soko_langu/**'
      - 'wallet_app/**'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - 'soko_langu/**'
      - 'wallet_app/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + test + web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soko_langu
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --base-href /

  node:
    name: Node API lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soko_langu/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: soko_langu/server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  android:
    name: Android release build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flutter, node]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soko_langu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: soko_langu/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: soko_langu/build/app/outputs/bundle/release/app-release.aab

  wallet-apk:
    name: Soko Vibe Wallet ARM64 APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: flutter create --platforms=android --org tz.sokovibe --project-name soko_vibe_wallet build_wallet
      - name: Copy wallet source
        run: |
          cp wallet_app/pubspec.yaml build_wallet/pubspec.yaml
          cp wallet_app/lib/main.dart build_wallet/lib/main.dart
      - name: Get packages
        working-directory: build_wallet
        run: flutter pub get
      - name: Build compact ARM64 APK
        working-directory: build_wallet
        env:
          SOKO_WALLET_API: ${{ secrets.SOKO_WALLET_API }}
          SOKO_WALLET_TOKEN: ${{ secrets.SOKO_WALLET_TOKEN }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=SOKO_WALLET_API="$SOKO_WALLET_API" --dart-define=SOKO_WALLET_TOKEN="$SOKO_WALLET_TOKEN"
      - name: Upload wallet APK
        uses: actions/upload-artifact@v4
        with:
          name: soko-vibe-wallet-arm64
          path: build_wallet/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
