name: Soko Vibe Subscription UI APK

on:
  push:
    branches:
      - main
      - feature/subscription-ui
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subscription_demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=soko_vibe_subscription_demo .

      - name: Get packages
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soko-Vibe-Subscription-UI-APK
          path: subscription_demo/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
