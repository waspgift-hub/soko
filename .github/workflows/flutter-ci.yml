name: Soko Vibe CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'soko_langu/**'
      - 'Dockerfile.prod'
      - 'docker-compose.yml'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches: [main]
    paths:
      - 'soko_langu/**'
      - 'Dockerfile.prod'
      - 'docker-compose.yml'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soko_langu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
