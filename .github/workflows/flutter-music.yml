name: Flutter validation

on:
  pull_request:
    paths:
      - 'music_app/**'
      - 'music_backend/**'
      - '.github/workflows/flutter-music.yml'
  push:
    branches:
      - 'soko-vibe-music'
      - 'fix/sokovibe-music-backend-url'
    paths:
      - 'music_app/**'
      - 'music_backend/**'
      - '.github/workflows/flutter-music.yml'

permissions:
  contents: read

jobs:
  validate-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Cloudflare Worker JavaScript syntax
        run: node --input-type=module --check < ../music_backend/worker.js
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android platform files
        run: flutter create --platforms=android --org=co.tz.sokovibe --project-name=soko_vibe_music .
      - name: Enable Android core library desugaring for notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_dir = Path("android/app")
          candidates = [app_dir / "build.gradle.kts", app_dir / "build.gradle"]
          gradle_file = next((p for p in candidates if p.exists()), None)
          if gradle_file is None:
              raise SystemExit("Android app Gradle file was not generated")

          content = gradle_file.read_text()
          is_kotlin = gradle_file.suffix == ".kts"
          enabled = "isCoreLibraryDesugaringEnabled = true" if is_kotlin else "coreLibraryDesugaringEnabled true"
          dependency = (
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if is_kotlin else
              "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          )

          if not re.search(r"\\bisCoreLibraryDesugaringEnabled\\s*=\\s*true\\b|\\bcoreLibraryDesugaringEnabled\\s+true\\b", content):
              pattern = r"(compileOptions\\s*\\{)"
              content, count = re.subn(pattern, lambda m: m.group(1) + "\\n        " + enabled, content, count=1)
              if count != 1:
                  raise SystemExit("Could not locate compileOptions block to enable core library desugaring")

          if "desugar_jdk_libs" not in content:
              pattern = r"(dependencies\\s*\\{)"
              content, count = re.subn(pattern, lambda m: m.group(1) + "\\n    " + dependency, content, count=1)
              if count == 0:
                  content = content.rstrip() + "\\n\\ndependencies {\\n    " + dependency + "\\n}\\n"

          gradle_file.write_text(content)
          verify = gradle_file.read_text()
          if "desugar_jdk_libs" not in verify or not re.search(r"\\bisCoreLibraryDesugaringEnabled\\s*=\\s*true\\b|\\bcoreLibraryDesugaringEnabled\\s+true\\b", verify):
              raise SystemExit("Desugaring configuration verification failed")
          print(f"Verified core library desugaring in {gradle_file}")
          PY
      - name: Remove generated placeholder widget test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub
      - name: Build release APK
        run: flutter build apk --release --no-pub
      - name: Verify release APK exists and is non-empty
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: soko-vibe-music-release-apk
          path: music_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
