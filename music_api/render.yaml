services:
  - type: web
    name: sokovibe-music-api
    runtime: docker
    dockerfilePath: ./music_api/Dockerfile
    dockerContext: ./music_api
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: CACHE_TTL
        value: "300"
      - key: YT_TIMEOUT
        value: "20"
      - key: CORS_ORIGINS
        value: "*"
