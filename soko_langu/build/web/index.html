<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Soko Vibe — Tanzania's Trusted Online Marketplace">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Soko Vibe">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Soko Vibe</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #000000; }
    .loading { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; flex-direction: column; font-family: Arial, sans-serif; background: #000000; }
    .loading h1 { color: #ffffff; font-size: 1.8em; font-weight: 700; letter-spacing: -0.02em; margin: 20px 0 4px; }
    .loading p { color: #9b9b9b; font-size: 0.95em; margin: 0; }
    .spinner { width: 26px; height: 26px; border: 2px solid #404040; border-top-color: #ffffff; border-radius: 50%; animation: spin 0.9s linear infinite; margin-top: 28px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <svg viewBox="0 0 512 512" width="72" height="72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#000000"/><path d="M256 96l128 96v224H128V192z" fill="#ffffff" transform="scale(0.9) translate(28,28)"/></svg>
    <h1>Soko Vibe</h1>
    <p>Inapakia...</p>
    <div class="spinner"></div>
  </div>
  <script>
    // hide the splash once the first Flutter frame is on screen; 4s fallback
    var splash = function () { var el = document.getElementById('loading'); if (el) el.style.display = 'none'; };
    window.addEventListener('flutter-first-frame', splash);
    window.setTimeout(splash, 4000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
