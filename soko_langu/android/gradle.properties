# R8 minification of the release build plus release lint exceeds a 2 GB heap
# on GitHub's Ubuntu runners (OutOfMemoryError at minifyReleaseWithR8 and
# lintVitalAnalyzeRelease). 4 GB has headroom without starving the runner.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m
org.gradle.parallel=false
android.useAndroidX=true
org.gradle.warning.mode=none
android.enableR8.fullMode=true
