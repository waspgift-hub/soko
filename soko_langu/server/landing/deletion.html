<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Data Deletion</title>
  <meta name="description" content="Submit a request to delete your data on Soko Vibe. We process requests within 30 days.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Soko Vibe">
  <meta property="og:description" content="Request deletion of your account and personal data on Soko Vibe.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.sokovibe.co.tz/data-deletion">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23000000'/%3E%3Ctext x='256' y='320' font-family='Arial,sans-serif' font-size='220' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js"></script>
  <script src="deletion_i18n.js"></script>
  <style>
    .field { margin-top: 18px; }
    .field-label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
    .field input,
    .field textarea {
      width: 100%; box-sizing: border-box; padding: 12px 14px;
      border: 1.5px solid var(--gray-200, #ddd); border-radius: 10px;
      font: inherit; background: #fff; color: var(--black, #000);
    }
    .field input:focus,
    .field textarea:focus { outline: none; border-color: var(--black, #000); }
    .del-note {
      color: var(--gray-600, #555); font-size: 14px; line-height: 1.7;
      margin: 14px 0 0; white-space: pre-line;
    }
    .deletion-submit { margin-top: 24px; }
    .form-msg { margin-top: 16px; font-size: 14px; line-height: 1.5; min-height: 1em; }
    .form-msg.ok { color: #0a7a3d; }
    .form-msg.err { color: #b3261e; }
    .del-links { margin-top: 10px; font-size: 14px; }
    .del-links a { color: var(--gray-700, #333); text-decoration: underline; margin-right: 14px; }
  </style>
</head>
<body data-title-key="del_title" data-desc-key="del_meta_desc">

  <header class="site">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" rx="112" fill="#000000"/><path d="M256 96l128 96v224H128V192z" fill="#ffffff" transform="scale(0.9) translate(28,28)"/></svg>
        Soko Vibe
      </a>
      <div style="display:flex;align-items:center;gap:12px;">
        <select class="lang-select" aria-label="Language">
          <option value="sw">Kiswahili</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="zh">中文</option>
          <option value="de">Deutsch</option>
        </select>
        <a class="nav-cta" href="index.html#app" data-i18n="nav_get_app">Get the App</a>
      </div>
    </div>
  </header>

  <main class="doc">
    <div class="doc-inner">
      <a class="back-home" href="index.html">← <span data-i18n="back_home">Back to home</span></a>
      <h1 data-i18n="del_title">Request Data Deletion</h1>

      <div class="doc-card">
        <p data-i18n="del_intro">Under our Privacy Policy (section 7), you can request deletion of your account and your personal data.</p>
        <p class="del-note" data-i18n="del_note_app"></p>
      </div>

      <div class="doc-card">
        <h2 data-i18n="del_form_title">Deletion Request Form</h2>
        <form id="deletionForm" novalidate>
          <div class="field">
            <label class="field-label" for="delName" data-i18n="del_full_name">Full Name</label>
            <input id="delName" name="fullName" type="text" autocomplete="name" placeholder="e.g. Juma Hassan" data-i18n-placeholder="del_full_name_ph" maxlength="120">
          </div>
          <div class="field">
            <label class="field-label" for="delEmail" data-i18n="del_email">Email</label>
            <input id="delEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com" data-i18n-placeholder="del_email_ph" maxlength="254">
          </div>
          <div class="field">
            <label class="field-label" for="delPhone" data-i18n="del_phone">Phone (optional)</label>
            <input id="delPhone" name="phone" type="tel" autocomplete="tel" placeholder="+255 7XX XXX XXX" data-i18n-placeholder="del_phone_ph" maxlength="20">
          </div>
          <div class="field">
            <label class="field-label" for="delReason" data-i18n="del_reason">Reason (optional)</label>
            <textarea id="delReason" name="reason" rows="4" placeholder="Tell us why you are deleting your data" data-i18n-placeholder="del_reason_ph" maxlength="2000"></textarea>
          </div>
          <!-- honeypot: real users never see this field, bots autofill it -->
          <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;">
          <button class="btn btn-dark deletion-submit" type="submit" data-i18n="del_submit">Submit Request</button>
          <p class="form-msg" id="delMsg" role="status"></p>
        </form>
        <p class="del-note" data-i18n="del_processing_note"></p>
      </div>

      <div class="doc-card">
        <p data-i18n="del_help"></p>
        <p class="del-links">
          <a href="privacy-policy" data-i18n="f_privacy">Privacy Policy</a>
          <a href="terms-of-service" data-i18n="f_terms">Terms of Service</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site">
    <div class="footer-bottom" style="max-width:820px;">
      <span data-i18n="f_rights">Soko Vibe Limited. All rights reserved.</span>
      <span data-i18n="f_made">Made with care in Tanzania 🇹🇿</span>
    </div>
  </footer>

  <script>
    (function () {
      var form = document.getElementById('deletionForm');
      var msg = document.getElementById('delMsg');
      function curLang() {
        var sel = document.querySelector('select.lang-select');
        return sel && sel.value ? sel.value : 'en';
      }
      function t(key) {
        var lang = curLang();
        if (SokoI18n.SUPPORTED.indexOf(lang) < 0) lang = 'en';
        return SokoI18n.t(lang, key);
      }
      var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        msg.className = 'form-msg';
        msg.textContent = '';
        var email = form.email.value.trim();
        if (!EMAIL_RE.test(email)) {
          msg.className = 'form-msg err';
          msg.textContent = t('del_bad_email');
          form.email.focus();
          return;
        }
        var btn = form.querySelector('[type="submit"]');
        var original = btn.textContent;
        btn.disabled = true;
        btn.textContent = t('del_submitting');
        var payload = { email: email };
        var name = form.fullName.value.trim();
        var phone = form.phone.value.trim();
        var reason = form.reason.value.trim();
        if (name) payload.fullName = name;
        if (phone) payload.phone = phone;
        if (reason) payload.reason = reason;
        fetch('/api/v1/data-deletion/requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
          .then(function (res) {
            if (res.ok && res.data && res.data.success) {
              form.style.display = 'none';
              msg.className = 'form-msg ok';
              msg.textContent = t('del_success');
            } else {
              throw new Error('submit-failed');
            }
          })
          .catch(function () {
            msg.className = 'form-msg err';
            msg.textContent = t('del_error');
          })
          .then(function () {
            btn.disabled = false;
            btn.textContent = original;
          });
      });
    })();
  </script>

</body>
</html>
