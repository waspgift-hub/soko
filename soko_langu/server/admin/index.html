<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Soko Vibe — Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2300A884'/><stop offset='1' stop-color='%23008069'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><path d='M30 38c0-9 8-16 20-16s20 6 20 15c0 13-22 12-22 24 0 3 2 5 6 5 5 0 8-3 9-7h7c-1 9-7 15-16 15-11 0-17-6-17-14 0-14 22-13 22-24 0-4-4-7-9-7s-9 3-10 9h-10z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- ============ SPLASH ============ -->
<div id="screen" class="screen">
  <div class="splash-card">
    <div class="spinner"></div>
    <div class="splash-logo">S</div>
    <h1>Soko Vibe</h1>
    <p>Admin ni inasubiri watumishi…</p>
  </div>
</div>

<!-- ============ LOGIN ============ -->
<div id="loginCard" class="screen" hidden>
  <div class="auth-card">
    <div class="logo-badge">S</div>
    <h1>Dukani Admin</h1>
    <p>Ingia kama msimamizi wa Soko Vibe</p>
    <button id="googleLoginBtn" class="gbtn" type="button" aria-label="Continue with Google">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span>Continue with Google</span>
    </button>
    <button id="showSecretBtn" class="linklike" type="button">Tumia ADMIN_SECRET (option)</button>
    <div id="secretPane" class="secretpane" hidden>
      <input id="secVal" class="field" type="password" autocomplete="off" placeholder="ADMIN_SECRET">
      <button id="secSave" class="btn accent full" type="button">Ingia kwa ADMIN_SECRET</button>
      <p class="hint">Njia ya awali. Siri huhifadhiwa kwenye kifaa hiki tu.</p>
    </div>
    <div class="err" id="authErr"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="brand">
      <div class="logo-badge">S</div>
      <div>
        <div class="nm">Soko Vibe</div>
        <div class="sub">Admin Panel</div>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-sec="dashboard"><i data-lucide="layout-dashboard"></i><span data-i18n="nav-dashboard">Dashibodi</span></button>
      <div class="grp" data-i18n="grp-manage">Usimamizi</div>
      <button class="nav-item" data-sec="users"><i data-lucide="users"></i><span data-i18n="nav-users">Watumiaji</span></button>
      <button class="nav-item" data-sec="sellers"><i data-lucide="store"></i><span data-i18n="nav-sellers">Wauzaji</span></button>
      <button class="nav-item" data-sec="products"><i data-lucide="package"></i><span data-i18n="nav-products">Bidhaa</span></button>
      <button class="nav-item" data-sec="orders"><i data-lucide="shopping-cart"></i><span data-i18n="nav-orders">Maagizo</span></button>
      <div class="grp" data-i18n="grp-protect">Ulinzi na Mahusiano</div>
      <button class="nav-item" data-sec="disputes"><i data-lucide="scale"></i><span data-i18n="nav-disputes">Migogoro</span></button>
      <button class="nav-item" data-sec="refunds"><i data-lucide="rotate-ccw"></i><span data-i18n="nav-refunds">Marejesho</span></button>
      <button class="nav-item" data-sec="reports"><i data-lucide="shield-alert"></i><span data-i18n="nav-reports">Ripoti & Ulinzi</span></button>
      <button class="nav-item" data-sec="kyc"><i data-lucide="badge-check"></i><span data-i18n="nav-kyc">Wathibitisho (KYC)</span></button>
      <div class="grp" data-i18n="grp-sales">Mauzo</div>
      <button class="nav-item" data-sec="promos"><i data-lucide="megaphone"></i><span data-i18n="nav-promos">Boost & Flash Sales</span></button>
      <div class="grp" data-i18n="grp-finance">Fedha</div>
      <button class="nav-item" data-sec="revenue"><i data-lucide="banknote"></i><span data-i18n="nav-revenue">Mapato ya Jukwaa</span></button>
      <button class="nav-item" data-sec="finance"><i data-lucide="wallet"></i><span data-i18n="nav-finance">Fedha & Ledger</span></button>
      <button class="nav-item" data-sec="referrals"><i data-lucide="gift"></i><span data-i18n="nav-referrals">Rufaa</span></button>
      <div class="grp" data-i18n="grp-comm">Mawasiliano</div>
      <button class="nav-item" data-sec="broadcasts"><i data-lucide="megaphone"></i><span data-i18n="nav-broadcasts">Matangazo ya Broad</span></button>
      <button class="nav-item" data-sec="landing"><i data-lucide="mail"></i><span data-i18n="nav-landing">Landing / Orodha</span></button>
      <button class="nav-item" data-sec="audit"><i data-lucide="scroll-text"></i><span data-i18n="nav-audit">Ukaguzi (Audit)</span></button>
      <button class="nav-item" data-sec="staff"><i data-lucide="shield-user"></i><span data-i18n="nav-staff">Wafanyakazi</span></button>
      <button class="nav-item" data-sec="settings"><i data-lucide="settings"></i><span data-i18n="nav-settings">Mipangilio</span></button>
      <div class="grp" data-i18n="grp-stats">Takwimu</div>
      <button class="nav-item" data-sec="stats"><i data-lucide="activity"></i><span data-i18n="nav-stats">Takwimu za Matumizi</span></button>
      <button class="nav-item" data-sec="insights"><i data-lucide="sparkles"></i><span>AI BI</span></button>
      <button class="nav-item" data-sec="releases"><i data-lucide="app-window"></i><span>Matoleo</span></button>
    </nav>
    <div class="me">
      <img id="meAvatar" alt="" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23e2f5eb'/><text x='16' y='21' font-family='Arial' font-size='14' font-weight='600' fill='%23043c26' text-anchor='middle'>?</text></svg>">
      <div class="who"><b id="meName">—</b><span id="meRole">admin</span></div>
      <button class="iconbtn" id="logoutBtn" title="Ondoka"><i data-lucide="log-out"></i></button>
    </div>
  </aside>

  <main id="main">
    <div class="topbar">
      <button class="iconbtn" id="menuBtn" title="Menyu"><i data-lucide="menu"></i></button>
      <h2 id="pageTitle">Dashibodi</h2>
      <div class="spacer"></div>
      <span class="lastupd" id="lastUpd"></span>
      <button class="btn sm" id="langBtn">SW · EN</button>
      <button class="iconbtn" id="refreshBtn" title="Sasisha"><i data-lucide="refresh-cw"></i></button>
      <button class="iconbtn" id="themeBtn" title="Badilisha rangi"><i data-lucide="moon"></i></button>
    </div>

    <section class="section active" data-sec="dashboard" id="sec-dashboard"></section>
    <section class="section" data-sec="users" id="sec-users"></section>
    <section class="section" data-sec="sellers" id="sec-sellers"></section>
    <section class="section" data-sec="products" id="sec-products"></section>
    <section class="section" data-sec="orders" id="sec-orders"></section>
    <section class="section" data-sec="disputes" id="sec-disputes"></section>
    <section class="section" data-sec="refunds" id="sec-refunds"></section>
    <section class="section" data-sec="reports" id="sec-reports"></section>
    <section class="section" data-sec="kyc" id="sec-kyc"></section>
    <section class="section" data-sec="promos" id="sec-promos"></section>
    <section class="section" data-sec="revenue" id="sec-revenue"></section>
    <section class="section" data-sec="finance" id="sec-finance"></section>
    <section class="section" data-sec="referrals" id="sec-referrals"></section>
    <section class="section" data-sec="broadcasts" id="sec-broadcasts"></section>
    <section class="section" data-sec="landing" id="sec-landing"></section>
    <section class="section" data-sec="audit" id="sec-audit"></section>
    <section class="section" data-sec="staff" id="sec-staff"></section>
    <section class="section" data-sec="stats" id="sec-stats"></section>
    <section class="section" data-sec="insights" id="sec-insights"></section>
    <section class="section" data-sec="releases" id="sec-releases"></section>
    <section class="section" data-sec="settings" id="sec-settings"></section>
  </main>
</div>

<!-- ============ OVERLAYS ============ -->
<div id="drawerOverlay" class="overlay" hidden></div>
<aside id="drawer" hidden><button class="iconbtn" id="drawerClose"><i data-lucide="x"></i></button><div id="drawerBody"></div></aside>

<div id="modalOverlay" class="overlay" hidden></div>
<div id="modalRoot" hidden></div>

<div id="toast" class="toast" role="status"></div>

<script src="/admin/admin.js"></script>
</body>
</html>
