<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Soko Vibe</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="canonical" href="https://www.sokovibe.co.tz/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{--bg:#f0f2f5;--card:#fff;--ink:#111b21;--muted:#667781;--brand:#008069;--line:#d9e0e6}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .card{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center}
    h1{margin:0;font-size:3rem;color:var(--brand)} p{color:var(--muted);line-height:1.6}
    a.btn{display:inline-block;margin-top:8px;background:var(--brand);color:#fff;text-decoration:none;padding:12px 18px;border-radius:12px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <h2>Page not found / Ukurasa haujapatikana</h2>
    <p>The page may have moved or does not exist. Rudi kwenye tovuti kuu ya Soko Vibe.</p>
    <a class="btn" href="/">Return Home</a>
  </main>
</body>
</html>
